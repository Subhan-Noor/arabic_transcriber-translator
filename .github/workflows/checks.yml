name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg for synthetic rendering checks
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Reject saved notebook outputs
        run: python tools/clean_notebooks.py --check
      - name: Regression tests (no models or channel assets downloaded)
        run: python -B -m unittest discover -s tests -v
